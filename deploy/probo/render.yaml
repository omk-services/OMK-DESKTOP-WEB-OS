# render.yaml — Blueprint Render pour Probo (conformité auto-hébergée)
#
# Pourquoi ce fichier existe (BRIEF L §2) :
#   Probo est sous licence AGPL-3.0. L'AGPL impose, à toute personne qui
#   modifie le logiciel ET l'offre via un réseau, de publier ses
#   modifications. La règle qui en découle, et qui n'est pas négociable :
#
#     Probo s'héberge A COTE, tel quel, jamais fourché dans Coach OS.
#
#   Ce Blueprint déploie Probo tel quel depuis son image Docker officielle.
#   Aucune ligne de Probo ne rentre dans le dépôt Coach OS.
#
# Comment l'utiliser :
#   1. Ouvrir https://dashboard.render.com/blueprints
#   2. "New Blueprint Instance" -> "Connect a repository"
#   3. Sélectionner le dépôt où vit ce fichier
#   4. Render lit render.yaml et propose un plan de service — valider
#   5. Renseigner SECRET_KEY et DATABASE_URL (déjà filés depuis la base)
#   6. Render construit et déploie. Le domaine par défaut est
#      <service-name>.onrender.com.
#
# Tarification (vérifié 2026-08-11) :
#   - Web service Probo : gratuit (Starter)
#   - Postgres managé   : gratuit pendant 90 jours, puis 7 $/mois
#   - Au premier client payant : 25 $/mois, tout compris
#
# Notes de licence :
#   - L'image upstream getprobo/probo-app est sous AGPL-3.0.
#   - Toute modification de cette image doit être publiée sous AGPL-3.0.
#   - Ce Blueprint n'altère pas l'image : il la déploie telle quelle.

services:
  - type: pserv
    name: coach-os-probo-db
    plan: starter
    # Plan Starter : 1 Go de stockage, 256 Mo de RAM. Suffisant pour un
    # déploiement mono-tenant d'un client coach. Quand le client a plus
    # de 5 utilisateurs actifs, basculer sur "Standard" (4 Go / 7 $/mois).
    ipAllowList: [] # none — pas d'accès direct. Probo passe par DATABASE_URL.

  - type: web
    name: coach-os-probo
    runtime: image
    # Image officielle, tag "stable" pour que les patchs de sécurité
    # remontent sans casser le déploiement. Pour figer une version,
    # remplacer par ex. "getprobo/probo-app:0.4.2".
    image: getprobo/probo-app:stable
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coach-os-probo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render génère et stocke un secret fort
        # NE PAS écrire cette valeur dans le dépôt. Render l'injecte à
        # chaque déploiement.
      - key: APP_URL
        sync: false # à remplir après le premier déploiement, voir README §4
      - key: ALLOWED_HOSTS
        sync: false # idem
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080" # Render expose 10000 par défaut, on aligne Probo
      # Variables optionnelles — décommenter si besoin :
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USERNAME
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: STORAGE_BUCKET
      #   sync: false