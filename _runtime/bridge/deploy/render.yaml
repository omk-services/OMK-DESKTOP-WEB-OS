# Ori n'a PAS de mode serveur — verifie le 2026-08-24 contre la doc officielle
# OpenRouter (openrouter.ai/docs/guides/ori/harness) :
#
#   "Each command starts the real agent CLI on your machine."
#
# `ori claude`, `ori codex`, `ori hermes`, etc. lancent la vraie CLI de
# l'agent en premier plan, configuree pour parler a OpenRouter — ce n'est
# pas un daemon qui repond a des requetes. L'authentification passe par
# OAuth PKCE avec ouverture de navigateur (`ori login`), ce qui ne
# fonctionne pas dans un service headless sans intervention humaine au
# premier lancement.
#
# Consequence : Ori n'est PAS deployable comme "meta-gateway persistant" sur
# Render. C'est un outil de SESSION — invoque quand un humain (ou un process
# supervise) travaille depuis une machine (local ou VPS via SSH), pas un
# service qui tourne en arriere-plan pour router le trafic des 8 domaines.
#
# Ce fichier est laisse vide de service Render intentionnellement. Si un
# besoin reel de deploiement cloud apparait pour un agent specifique (par
# exemple Codex, qui expose --full-auto pour un mode moins interactif selon
# la doc), il faudra un blueprint dedie a CET agent — pas a Ori comme
# facade, et avec le mode d'authentification de CET agent verifie separement.

services: []
